services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    ports:
      - "8002:8000"
    environment:
      APP_ENV: local
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: unless-stopped

volumes:
  vendor:
