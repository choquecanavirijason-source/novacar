; Autopartes/vehículos se guardan con foto en base64 (data URL, ver ImageUrlField
; en el frontend) hasta que se migre a Laravel Storage/S3/Cloudinary real (ver
; docs/WORKLOG.md, fase de "Imágenes y contenido"). Una foto de celular normal en
; base64 supera fácilmente el default de PHP (post_max_size=8M) y la petición se
; corta antes de llegar a Laravel — sin este límite más alto, admins con fotos de
; buena calidad no pueden guardar autopartes/vehículos.
post_max_size = 32M
upload_max_filesize = 32M
memory_limit = 256M
